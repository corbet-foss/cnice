[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cnice"
version = "0.1.1"
description = "Formulaic correspondence phrases: German salutations and locale-specific valedictions (cnice.greet + cnice.farewell)"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSES/*"]
requires-python = ">=3.10"
keywords = ["i18n", "correspondence", "locale"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]


[project.urls]
Homepage = "https://github.com/corbet-foss/cnice#readme"
Repository = "https://github.com/corbet-foss/cnice"
Issues = "https://github.com/corbet-foss/cnice/issues"

[project.scripts]
cnice = "cnice.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cnice"]
